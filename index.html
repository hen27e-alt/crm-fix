<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRM Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#07080f;--card:#0f1018;--card2:#161720;--border:rgba(255,255,255,0.07);
  --accent:#6c63ff;--accent2:#a78bfa;--green:#22c55e;--yellow:#f59e0b;
  --red:#ef4444;--cyan:#06b6d4;--pink:#ec4899;--text:#e2e8f0;--muted:#64748b;
  --nav:#0a0b16;color-scheme:dark;
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f1f3fa;--card:#ffffff;--card2:#eef0f8;--border:rgba(0,0,0,0.08);
    --accent:#5b52e8;--accent2:#7c6fe8;--green:#16a34a;--yellow:#d97706;
    --red:#dc2626;--cyan:#0891b2;--pink:#db2777;--text:#1a1b2e;--muted:#64748b;
    --nav:#1a1b2e;color-scheme:light;
  }
}
:root[data-theme="dark"]{
  --bg:#07080f;--card:#0f1018;--card2:#161720;--border:rgba(255,255,255,0.07);
  --accent:#6c63ff;--accent2:#a78bfa;--green:#22c55e;--yellow:#f59e0b;
  --red:#ef4444;--cyan:#06b6d4;--pink:#ec4899;--text:#e2e8f0;--muted:#64748b;
  --nav:#0a0b16;color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f1f3fa;--card:#ffffff;--card2:#eef0f8;--border:rgba(0,0,0,0.08);
  --accent:#5b52e8;--accent2:#7c6fe8;--green:#16a34a;--yellow:#d97706;
  --red:#dc2626;--cyan:#0891b2;--pink:#db2777;--text:#1a1b2e;--muted:#64748b;
  --nav:#1a1b2e;color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Heebo',sans-serif;font-size:14px;}
body{overflow-x:clip;}
button{cursor:pointer;font-family:inherit;}
input,textarea,select{font-family:inherit;}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;text-wrap:balance;}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:200;}

#app{display:flex;flex-direction:column;min-height:100%;}

/* ── TOP BAR ── */
.topbar{
  background:var(--bg);
  display:flex;align-items:center;gap:10px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  height:56px;position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  border-bottom:1px solid var(--border);
}
.tb-brand{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  flex:1;}
.tb-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:600;flex:1;}
.tb-actions{display:flex;gap:7px;align-items:center;}

/* ── CONTENT ── */
#content{
  flex:1;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(80px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--nav);border-top:1px solid var(--border);
  display:flex;align-items:center;
  padding-bottom:env(safe-area-inset-bottom,0px);
  height:calc(60px + env(safe-area-inset-bottom,0px));
  z-index:100;
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 0;cursor:pointer;gap:3px;color:var(--muted);transition:color .15s;
}
.bn-item.active{color:var(--accent2);}
.bn-icon{font-size:1.3rem;line-height:1;}
.bn-lbl{font-size:.6rem;letter-spacing:.02em;}
.bn-fab{
  width:50px;height:50px;border-radius:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;font-weight:300;color:#fff;border:none;flex-shrink:0;
  box-shadow:0 4px 24px rgba(108,99,255,.55);
  transition:transform .15s;
}
.bn-fab:hover{transform:scale(1.08);}

/* ── PROJECT GRID ── */
.projects-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(min-width:540px){.projects-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}}
@media(min-width:900px){.projects-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}}

.project-card{
  background:var(--card);border:1px solid var(--border);border-radius:22px;
  overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
  transition:transform .2s,box-shadow .2s;
}
.project-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.3);}
.proj-logo{
  aspect-ratio:1 / 0.9;
  display:flex;align-items:center;justify-content:center;
  font-size:2.6rem;position:relative;
}
.proj-logo-overlay{position:absolute;inset:0;background:rgba(0,0,0,.12);}
.proj-logo span{position:relative;z-index:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
.proj-card-body{padding:8px 10px 12px;text-align:center;}
.proj-card-name{font-family:'Space Grotesk',sans-serif;font-size:.8rem;font-weight:600;line-height:1.3;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.proj-card-status{font-size:.62rem;color:var(--muted);margin-bottom:4px;}
.proj-bar{height:3px;background:var(--border);border-radius:2px;}
.proj-bar-fill{height:100%;border-radius:2px;}

/* ── PROJECT DETAIL HERO ── */
.proj-hero{
  margin:-20px -16px 24px;
  padding:max(50px,calc(env(safe-area-inset-top,0px)+30px)) 20px 24px;
  display:flex;flex-direction:column;align-items:center;
  position:relative;
}
.proj-hero::after{content:"";position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(to bottom,transparent,var(--bg));}
.proj-hero-emoji{font-size:4.5rem;margin-bottom:14px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));}
.proj-hero-name{font-family:'Space Grotesk',sans-serif;font-size:1.7rem;font-weight:700;color:#fff;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.4);}
.proj-hero-desc{font-size:.84rem;color:rgba(255,255,255,.7);text-align:center;margin-top:6px;max-width:320px;text-shadow:0 1px 4px rgba(0,0,0,.5);}
.proj-hero-meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
.proj-hero-actions{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1;flex-wrap:wrap;justify-content:center;padding-inline:12px}
.hero-btn{padding:7px 16px;border-radius:10px;border:none;font-size:.8rem;font-weight:500;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(10px);}
.hero-btn:hover{background:rgba(255,255,255,.28);}
.hero-btn.danger{background:rgba(239,68,68,.25);color:#fca5a5;}

/* ── STATUS PILL ── */
.status-pill{padding:3px 10px;border-radius:20px;font-size:.65rem;font-weight:600;letter-spacing:.04em;}
.sp-active{background:rgba(34,197,94,.15);color:var(--green);}
.sp-paused{background:rgba(245,158,11,.15);color:var(--yellow);}
.sp-done{background:rgba(100,116,139,.15);color:var(--muted);}
.sp-active-hero{background:rgba(34,197,94,.2);color:#a7f3d0;}
.sp-paused-hero{background:rgba(245,158,11,.2);color:#fde68a;}
.sp-done-hero{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);}

/* ── TABS ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:10px 14px;cursor:pointer;font-size:.82rem;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent2);}
.tab:hover:not(.active){color:var(--text);}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:600;}

/* ── STAT TILES ── */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
@media(min-width:600px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s;}
.stat-card:hover{border-color:var(--accent2);}
.stat-icon{font-size:1.3rem;margin-bottom:7px;}
.stat-val{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700;line-height:1;}
.stat-label{font-size:.72rem;color:var(--muted);margin-top:4px;}

/* ── TASK LIST ── */
.task-list{display:flex;flex-direction:column;gap:7px;}
.task-row{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;display:flex;align-items:center;gap:11px;}
.task-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.task-check.done{background:var(--green);border-color:var(--green);color:#fff;}
.task-text{flex:1;font-size:.85rem;}
.task-text.done{text-decoration:line-through;color:var(--muted);}
.pri-pill{padding:2px 8px;border-radius:20px;font-size:.65rem;font-weight:600;}
.pri-high{background:rgba(239,68,68,.12);color:var(--red);}
.pri-med{background:rgba(245,158,11,.12);color:var(--yellow);}
.pri-low{background:rgba(100,116,139,.12);color:var(--muted);}

/* ── NOTES ── */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.note-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;position:relative;}
.note-title{font-weight:600;font-size:.85rem;margin-bottom:6px;}
.note-body{font-size:.8rem;color:var(--muted);white-space:pre-wrap;line-height:1.5;}
.note-date{font-size:.65rem;color:var(--muted);margin-top:8px;}
.note-del{position:absolute;top:9px;inset-inline-start:9px;background:none;border:none;color:var(--muted);cursor:pointer;opacity:0;transition:opacity .15s;font-size:.85rem;}
.note-card:hover .note-del{opacity:1;}

/* ── CONTACTS ── */
.contacts-list{display:flex;flex-direction:column;gap:8px;}
.contact-row{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;align-items:center;gap:13px;}
.c-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;flex-shrink:0;color:#fff;}
.c-info{flex:1;min-width:0;}
.c-name{font-size:.87rem;font-weight:500;}
.c-detail{font-size:.72rem;color:var(--muted);}
.c-actions{display:flex;gap:5px;}

/* ── SOCIAL ── */
.platforms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.plat-card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:16px;text-align:center;transition:all .2s;}
.plat-card.connected{border-color:var(--green);}
.plat-card:hover{transform:translateY(-2px);}
.plat-icon{font-size:1.9rem;margin-bottom:7px;}
.plat-name{font-size:.8rem;font-weight:600;margin-bottom:3px;}
.plat-status{font-size:.68rem;}
.plat-status.on{color:var(--green);}
.plat-status.off{color:var(--muted);}
.plat-btn{margin-top:10px;padding:5px 14px;border-radius:6px;border:none;font-size:.72rem;font-weight:600;cursor:pointer;width:100%;transition:all .15s;}
.plat-btn.connect{background:rgba(108,99,255,.18);color:var(--accent2);}
.plat-btn.disconnect{background:rgba(239,68,68,.12);color:var(--red);}
.pub-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:20px;}
.pub-title{font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:600;margin-bottom:16px;}
.plat-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.plat-chip{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:.78rem;transition:all .15s;user-select:none;}
.plat-chip.selected{background:rgba(108,99,255,.18);border-color:var(--accent2);color:var(--accent2);}
.plat-chip.disabled{opacity:.35;cursor:not-allowed;}
.media-drop{border:2px dashed var(--border);border-radius:8px;padding:22px;text-align:center;cursor:pointer;margin-bottom:14px;transition:border-color .15s;}
.media-drop:hover{border-color:var(--accent);}
.media-previews{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.thumb-wrap{position:relative;display:inline-block;}
.thumb-img{width:76px;height:76px;border-radius:8px;object-fit:cover;border:1px solid var(--border);display:block;}
.thumb-vid{width:76px;height:76px;border-radius:8px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
.thumb-del{position:absolute;top:-6px;inset-inline-end:-6px;width:18px;height:18px;background:var(--red);color:#fff;border-radius:50%;border:none;font-size:.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sched-row{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.sched-row label{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer;}

/* ── POSTS TABLE ── */
.posts-table{width:100%;border-collapse:collapse;}
.posts-table th{text-align:right;padding:8px 12px;font-size:.72rem;color:var(--muted);border-bottom:1px solid var(--border);font-weight:500;}
.posts-table td{padding:10px 12px;font-size:.8rem;border-bottom:1px solid rgba(255,255,255,.025);vertical-align:middle;}
[data-theme="light"] .posts-table td{border-bottom:1px solid rgba(0,0,0,.04);}
.posts-table tr:hover td{background:rgba(108,99,255,.04);}
.post-plats{display:flex;gap:5px;}
.post-pill{padding:2px 8px;border-radius:20px;font-size:.65rem;font-weight:600;}
.pp-sent{background:rgba(34,197,94,.12);color:var(--green);}
.pp-sched{background:rgba(245,158,11,.12);color:var(--yellow);}
.pp-draft{background:rgba(100,116,139,.12);color:var(--muted);}
.pp-fail{background:rgba(239,68,68,.12);color:var(--red);}

/* ── APPS ── */
.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;}
.app-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;transition:border-color .2s;}
.app-card.installed{border-color:rgba(108,99,255,.3);}
.app-icon{font-size:2.4rem;margin-bottom:9px;}
.app-name{font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:600;margin-bottom:4px;}
.app-desc{font-size:.72rem;color:var(--muted);margin-bottom:14px;line-height:1.4;}
.app-btn{padding:7px;border-radius:7px;border:none;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s;width:100%;}
.app-btn.open{background:var(--accent);color:#fff;}
.app-btn.open:hover{filter:brightness(1.12);}
.app-btn.install{background:rgba(108,99,255,.14);color:var(--accent2);}
.app-btn.install:hover{background:rgba(108,99,255,.24);}
.app-btn.remove{background:rgba(239,68,68,.1);color:var(--red);}

/* ── BUTTONS ── */
.btn{padding:7px 16px;border-radius:8px;border:none;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{filter:brightness(1.12);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--accent2);color:var(--text);}
.btn-danger{background:var(--red);color:#fff;}
.btn-sm{padding:5px 12px;font-size:.78rem;}
.btn-icon{padding:7px;border-radius:7px;background:var(--card2);border:1px solid var(--border);color:var(--muted);}
.btn-icon:hover{color:var(--text);border-color:var(--accent2);}

/* ── INPUTS ── */
.input{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);outline:none;font-size:.85rem;transition:border-color .15s;width:100%;}
.input:focus{border-color:var(--accent);}
select.input{cursor:pointer;}
textarea.input{resize:vertical;min-height:80px;line-height:1.5;}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px;font-weight:500;}
.form-row{display:flex;gap:10px;}
.form-row .form-group{flex:1;min-width:0;}
.add-row{display:flex;gap:8px;margin-bottom:14px;}
.add-row .input{flex:1;}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px);}
.overlay.hidden{display:none;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:500px;max-height:90dvh;overflow-y:auto;}
.modal-sm{max-width:360px;}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:600;}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px;}
.modal-close:hover{color:var(--text);}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}

/* ── TOAST ── */
#toasts{position:fixed;bottom:max(80px,calc(70px + env(safe-area-inset-bottom,0px)));inset-inline-start:16px;z-index:300;display:flex;flex-direction:column;gap:7px;}
.toast{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-size:.82rem;display:flex;align-items:center;gap:9px;animation:toastIn .25s ease;min-width:200px;max-width:300px;}
.toast.success{border-color:var(--green);}
.toast.error{border-color:var(--red);}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── EMPTY ── */
.empty{text-align:center;padding:44px 20px;color:var(--muted);}
.empty-icon{font-size:2.6rem;margin-bottom:10px;}
.empty-text{font-size:.88rem;margin-bottom:14px;}

/* ── BACK BUTTON AREA ── */
.back-row{margin-bottom:0;}

/* ── SEARCH ── */
.search-box{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;flex:1;max-width:260px;}
.search-box input{background:none;border:none;outline:none;color:var(--text);width:100%;font-size:.82rem;}
.search-box input::placeholder{color:var(--muted);}

/* ── SECTION HEAD ── */
.section-head{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:20px 0 10px;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* ── PLATFORM BADGES / SHARE ── */
.pi{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:7px;color:#fff;font-weight:700;font-size:.7em;line-height:1;vertical-align:middle;letter-spacing:-.02em}
.plat-icon .pi{width:2.2rem;height:2.2rem;font-size:1rem;border-radius:11px}
.plat-note{font-size:.76rem;color:var(--muted);line-height:1.55;margin:12px 0}
.share-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.share-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.88rem}
.share-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
a.btn{text-decoration:none}
.qpub-chip,.plat-chip{gap:7px}
/* ── LOGOS / DEPLOY PILLS ── */
.logo{display:inline-flex;width:var(--s,48px);height:var(--s,48px);flex:none;border-radius:calc(var(--s,48px)*.22);overflow:hidden;align-items:center;justify-content:center;font-size:calc(var(--s,48px)*.5);line-height:1}
.logo svg{width:100%;height:100%;display:block}
.logo.fb{color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.dep{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.dep::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.dep-good{color:var(--green)}.dep-info{color:var(--cyan)}.dep-warn{color:var(--yellow)}
.hero-stage .dep{color:#fff;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:20px;backdrop-filter:blur(8px)}
.hero-stage .dep-good::before{background:#4ade80}.hero-stage .dep-warn::before{background:#fbbf24}.hero-stage .dep-info::before{background:#67e8f9}

/* ── HOME / STREAMER ── */
.home-hd{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.hh-kicker{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.home-hd h2{font-family:'Space Grotesk','Heebo',sans-serif;font-size:1.5rem;font-weight:700}
.hero-stage{position:relative;overflow:hidden;isolation:isolate;border-radius:26px;padding:20px 20px 16px;color:#fff;background:linear-gradient(150deg,var(--g1),var(--g2));display:flex;flex-direction:column;gap:10px;min-height:340px;box-shadow:0 18px 50px -18px var(--g2)}
.hs-glow{position:absolute;inset:auto -25% -45% -25%;height:75%;background:radial-gradient(closest-side,var(--ac),transparent 72%);opacity:.38;z-index:-1;pointer-events:none}
.hs-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hs-en{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:600}
.hs-logo{margin-top:6px}
.hs-logo .logo{box-shadow:0 14px 38px rgba(0,0,0,.5)}
.hero-stage h1{font-family:'Heebo',sans-serif;font-size:2.1rem;font-weight:800;line-height:1.1;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.hs-tag{font-size:1rem;font-weight:500;color:rgba(255,255,255,.92)}
.hs-desc{font-size:.8rem;line-height:1.55;color:rgba(255,255,255,.72);max-width:34ch;min-width:0}
.hs-actions{display:flex;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.hs-play{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 22px;border-radius:14px;border:none;background:#fff;color:#0b0b12;font-weight:700;font-size:.95rem}
.hs-play:hover{filter:brightness(.94)}
.hs-sec{display:inline-flex;align-items:center;gap:7px;height:46px;padding:0 16px;border-radius:14px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:.85rem;backdrop-filter:blur(10px)}
.hs-sec:hover{background:rgba(255,255,255,.22)}
.hs-dots{display:flex;gap:6px;justify-content:center;padding-top:10px}
.hs-dot{width:7px;height:7px;border-radius:99px;border:none;padding:0;background:rgba(255,255,255,.35);transition:width .2s,background .2s}
.hs-dot.on{width:22px;background:#fff}
.ico{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.fill{fill:currentColor;stroke:none}

.rail-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.rail-head h3{font-family:'Space Grotesk','Heebo',sans-serif;font-size:1.02rem;font-weight:700}
.rail-head span{font-size:.72rem;color:var(--muted)}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin-inline:-16px;padding:4px 16px 8px}
.rail::-webkit-scrollbar{display:none}
.poster{position:relative;flex:none;width:132px;aspect-ratio:3/4.2;scroll-snap-align:start;border-radius:20px;overflow:hidden;cursor:pointer;color:#fff;background:linear-gradient(160deg,var(--g1),var(--g2));display:flex;flex-direction:column;justify-content:space-between;padding:12px;border:1px solid rgba(255,255,255,.08);transition:transform .2s,box-shadow .2s}
.poster:hover,.poster:focus-visible{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 30px -10px var(--g2)}
.poster::after{content:"";position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(to top,rgba(0,0,0,.62),transparent);pointer-events:none}
.po-logo{display:flex;justify-content:center;padding-top:10px}
.po-logo .logo{box-shadow:0 8px 22px rgba(0,0,0,.45)}
.po-info{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px}
.po-name{font-weight:700;font-size:.9rem;line-height:1.2}
.po-info .dep{font-size:.62rem;color:#fff}
.po-info .dep-good::before{background:#4ade80}.po-info .dep-warn::before{background:#fbbf24}.po-info .dep-info::before{background:#67e8f9}
.po-more{position:absolute;z-index:2;top:8px;inset-inline-end:8px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.4);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}

.ctl{display:flex;flex-direction:column;gap:8px}

.pl-id small{display:block;font-size:.68rem;color:rgba(255,255,255,.7);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pl-stage{position:relative;flex:1;min-height:0;background:#fff}

<script>
document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','he');
// ═══════════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════════
const SK = 'crm_pro_v3';
let S = {
  view: 'home', pid: null, tab: 'overview', recent: [], featured: null,
  projects: [], posts: [],
  conns: {
    facebook:  { on:false, token:'', page:'' },
    instagram: { on:false, token:'', user:'' },
    youtube:   { on:false, token:'', channel:'' },
    telegram:  { on:false, token:'', chat:'' },
    whatsapp:  { on:false, token:'', phone:'' },
    tiktok:    { on:false, token:'' }
  }
};
function load(){try{const d=localStorage.getItem(SK);if(d){const p=JSON.parse(d);S={...S,...p};if(!S.conns)S.conns={};if(!S.posts)S.posts=[];if(!S.recent)S.recent=[];}}catch(e){}}
function save(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}

// Project color palettes
const PALETTES=[
  ['#8b5cf6','#ec4899'],
  ['#3b82f6','#06b6d4'],
  ['#f43f5e','#fb923c'],
  ['#312e81','#6d28d9'],
  ['#059669','#10b981'],
  ['#f59e0b','#ef4444'],
  ['#0891b2','#6c63ff'],
];
const SEED_PAL={'seed-bi':0,'seed-cm':1,'seed-pb':2,'seed-kb':3,'seed-game':4};
function projPalIdx(p){
  if(SEED_PAL[p.id]!==undefined) return SEED_PAL[p.id];
  let h=0;for(const c of p.id)h=(h*31+c.charCodeAt(0))>>>0;
  return h%PALETTES.length;
}
function projGrad(p){const[a,b]=projG(p);return`linear-gradient(135deg,${a},${b})`;}
function projColor1(p){return projG(p)[0];}

const _pi=(bg,t)=>`<span class="pi" style="background:${bg}">${t}</span>`;
const PLATS = {
  facebook:  {name:'Facebook', icon:_pi('#1877F2','f'), mode:'שיתוף בלחיצה'},
  instagram: {name:'Instagram',icon:_pi('linear-gradient(135deg,#F58529,#DD2A7B,#8134AF)','ig'), mode:'שיתוף בלחיצה'},
  youtube:   {name:'YouTube',  icon:_pi('#FF0000','▶'), mode:'שיתוף בלחיצה'},
  telegram:  {name:'Telegram', icon:_pi('#229ED9','T'), mode:'שליחה אוטומטית', fields:[{id:'token',label:'Bot Token',type:'password',ph:'123456:ABC-DEF...'},{id:'chat',label:'Chat ID / ערוץ',type:'text',ph:'@mychannel'}]},
  whatsapp:  {name:'WhatsApp', icon:_pi('#25D366','W'), mode:'שיתוף בלחיצה'},
  tiktok:    {name:'TikTok',   icon:_pi('#111','♪'), mode:'שיתוף בלחיצה'}
};
// ═══════════════════════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════════════════════
let _editPid = null;
function nav(view){
  S.view=view;
  if(view!=='detail'){S.pid=null;history.replaceState(null,'',location.pathname);}
  syncNav(); syncTopbar(); render();
}
function syncNav(){
  document.querySelectorAll('.bn-item').forEach(el=>{
    const v=el.dataset.view;
    el.classList.toggle('active', v===S.view||(S.view==='detail'&&v==='projects'));
  });
}
function syncTopbar(){
  const isBrand=S.view==='home'||S.view==='projects'||S.view==='dashboard';
  document.getElementById('tb-brand').style.display=isBrand?'':'none';
  document.getElementById('tb-title').style.display=isBrand?'none':'';
  const titles={social:'מדיה חברתית',detail:'ניהול אפליקציה'};
  document.getElementById('tb-title').textContent=titles[S.view]||'';
  document.getElementById('tb-search').style.display=(S.view==='home'||S.view==='projects'||S.view==='dashboard')?'':'none';
  const fabLabels={home:'+ אפליקציה',projects:'+ אפליקציה',social:'פרסם',detail:'ערוך',dashboard:'+ אפליקציה'};
  document.getElementById('bn-fab').title=fabLabels[S.view]||'+';
}
function topbarAction(){
  const a={
    home:()=>openProjectModal(),dashboard:()=>openProjectModal(),projects:()=>openProjectModal(),
    social:()=>publishPost(),
    detail:()=>openProjectModal(S.pid)
  };
  (a[S.view]||function(){})();
}
function render(){
  const c=document.getElementById('content');c.innerHTML='';
  ({home:renderHome,dashboard:renderDash,projects:renderProjects,social:renderSocial,detail:renderDetail}[S.view]||renderHome)();
}

// ═══════════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════════
function renderDash(){
  const c=document.getElementById('content');
  const allTasks=S.projects.flatMap(p=>p.tasks||[]);
  const done=allTasks.filter(t=>t.done).length;
  const connCount=Object.values(S.conns).filter(x=>x.on).length;
  const sentPosts=S.posts.filter(p=>p.status==='sent').length;
  c.innerHTML=`
  <div class="stats-grid">
    <div class="stat-card" onclick="nav('projects')"><div class="stat-icon">📁</div><div class="stat-val">${S.projects.length}</div><div class="stat-label">פרוייקטים</div></div>
    <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-val">${done}/${allTasks.length}</div><div class="stat-label">משימות</div></div>
    <div class="stat-card" onclick="nav('social')"><div class="stat-icon">📡</div><div class="stat-val">${connCount}</div><div class="stat-label">פלטפורמות מחוברות</div></div>
    <div class="stat-card" onclick="nav('social')"><div class="stat-icon">🚀</div><div class="stat-val">${sentPosts}</div><div class="stat-label">פוסטים שנשלחו</div></div>
  </div>
  <div class="section-head">הפרוייקטים שלי</div>
  <div class="projects-grid" style="margin-bottom:20px">${S.projects.slice(0,6).map(projCard).join('')}</div>
  ${S.posts.length>0?`<div class="card"><div class="card-header"><div class="card-title">🕐 פוסטים אחרונים</div></div>${postsTableHTML('all',5)}</div>`:''}
  `;
}

// ═══════════════════════════════════════════════════════════════
// PROJECTS LIST
// ═══════════════════════════════════════════════════════════════
function renderProjects(){
  const c=document.getElementById('content');
  if(S.projects.length===0){
    c.innerHTML=`<div class="empty"><div class="empty-icon">📂</div><div class="empty-text">אין פרוייקטים עדיין</div><button class="btn btn-primary" onclick="openProjectModal()">+ פרוייקט חדש</button></div>`;
    return;
  }
  c.innerHTML=`<div class="projects-grid" id="proj-grid">${S.projects.map(projCard).join('')}</div>`;
}
function projCard(p){
  const tasks=p.tasks||[];const done=tasks.filter(t=>t.done).length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  const grad=projGrad(p);
  const col1=projColor1(p);
  return`<div class="project-card" onclick="openProject('${p.id}')">
    <div class="proj-logo" style="background:${grad}">
      <div class="proj-logo-overlay"></div>
      ${logoHTML(p,60)}
    </div>
    <div class="proj-card-body">
      <div class="proj-card-name">${esc(p.name)}</div>
      <div class="proj-card-status">${sLabel(p.status)} · ${pct}%</div>
      <div class="proj-bar"><div class="proj-bar-fill" style="width:${pct}%;background:${col1}"></div></div>
    </div>
  </div>`;
}
function filterP(status){
  const g=document.getElementById('proj-grid');if(!g)return;
  const list=status==='all'?S.projects:S.projects.filter(p=>p.status===status);
  g.innerHTML=list.length===0?`<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--muted)">אין פרוייקטים</div>`:list.map(projCard).join('');
}

// ═══════════════════════════════════════════════════════════════
// PROJECT DETAIL
// ═══════════════════════════════════════════════════════════════
function openProject(id){S.pid=id;S.tab='overview';S.view='detail';history.replaceState(null,'','#'+id);syncNav();syncTopbar();render();}
function copyProjectLink(id){
  const url=location.origin+location.pathname+'#'+id;
  navigator.clipboard.writeText(url).then(()=>{
    const btn=document.getElementById('copy-link-btn');
    if(btn){const old=btn.textContent;btn.textContent='✅ הועתק!';setTimeout(()=>{btn.textContent=old;},2000);}
  });
}

function renderDetail(){
  const p=S.projects.find(x=>x.id===S.pid);if(!p){nav('projects');return;}
  const c=document.getElementById('content');
  const tasks=p.tasks||[];const done=tasks.filter(t=>t.done).length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  const grad=projGrad(p);
  const spHero={'active':'sp-active-hero','paused':'sp-paused-hero','done':'sp-done-hero'}[p.status]||'sp-active-hero';
  c.innerHTML=`
    <div class="proj-hero" style="background:${grad}">
      <div class="proj-hero-emoji">${logoHTML(p,92)}</div>
      <div class="proj-hero-name">${esc(p.name)}</div>
      <div class="proj-hero-desc">${esc(p.description||'')}</div>
      <div class="proj-hero-meta">
        <span class="status-pill ${spHero}">${sLabel(p.status)}</span>
        ${p.category?`<span style="font-size:.7rem;background:rgba(255,255,255,.15);color:rgba(255,255,255,.85);padding:3px 10px;border-radius:20px">📂 ${esc(p.category)}</span>`:''}
        <span style="font-size:.7rem;background:rgba(255,255,255,.15);color:rgba(255,255,255,.85);padding:3px 10px;border-radius:20px">✅ ${done}/${tasks.length}</span>
      </div>
      <div class="proj-hero-actions">
        <button onclick="nav('home')" class="hero-btn">← חזרה</button>
        <button onclick="openBrowser('${p.id}')" class="hero-btn" style="background:rgba(255,255,255,.25);font-weight:600">▶ פתח</button>
        <button onclick="switchTab('campaigns')" class="hero-btn" style="background:rgba(108,99,255,.35);font-weight:600">📡 פרסם</button>
        <button id="copy-link-btn" onclick="copyProjectLink('${p.id}')" class="hero-btn">🔗</button>
        <button onclick="openProjectModal('${p.id}')" class="hero-btn">✏️</button>
        <button onclick="confirmDelete(${esc(JSON.stringify('האפליקציה "'+p.name+'" תימחק לצמיתות.'))},()=>deleteProject('${p.id}'))" class="hero-btn danger">🗑️</button>
      </div>
    </div>
    <div class="tabs" id="detail-tabs">
      ${['overview','tasks','notes','contacts','campaigns'].map(t=>`<div class="tab${S.tab===t?' active':''}" onclick="switchTab('${t}')">${tabLbl(t)}</div>`).join('')}
    </div>
    <div id="tab-body"></div>
  `;
  renderTab(S.tab);
}
function switchTab(t){
  S.tab=t;
  document.querySelectorAll('#detail-tabs .tab').forEach((el,i)=>{
    el.classList.toggle('active',['overview','tasks','notes','contacts','campaigns'][i]===t);
  });
  renderTab(t);
}
function renderTab(t){
  const body=document.getElementById('tab-body');if(!body)return;
  const p=S.projects.find(x=>x.id===S.pid);if(!p)return;
  ({overview:tabOverview,tasks:tabTasks,notes:tabNotes,contacts:tabContacts,campaigns:tabCampaigns}[t]||tabOverview)(p,body);
}
function tabLbl(t){return{overview:'📊 סקירה',tasks:'✅ משימות',notes:'📝 הערות',contacts:'👥 קשרים',campaigns:'🚀 קמפיינים'}[t]||t;}

function tabOverview(p,body){
  const tasks=p.tasks||[];const done=tasks.filter(t=>t.done).length;const pct=tasks.length?Math.round(done/tasks.length*100):0;
  body.innerHTML=`
  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px">
    ${[['✅',`${done}/${tasks.length}`,'משימות'],['📝',(p.notes||[]).length,'הערות'],['👥',(p.contacts||[]).length,'קשרים'],['🚀',(p.campaigns||[]).length,'קמפיינים']].map(([ic,v,lb])=>`
    <div class="card" style="text-align:center"><div style="font-size:1.5rem;margin-bottom:8px">${ic}</div><div style="font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700">${v}</div><div style="font-size:.72rem;color:var(--muted);margin-top:4px">${lb}</div></div>`).join('')}
  </div>
  ${tasks.filter(t=>!t.done).length>0?`<div class="card"><div class="card-header"><div class="card-title">⚡ משימות פתוחות</div><button class="btn btn-ghost btn-sm" onclick="switchTab('tasks')">הכל</button></div><div class="task-list">${tasks.filter(t=>!t.done).slice(0,4).map(t=>taskRow(t,p.id)).join('')}</div></div>`:''}
  ${(p.notes||[]).length>0?`<div class="card" style="margin-top:14px"><div class="card-header"><div class="card-title">📝 הערות אחרונות</div><button class="btn btn-ghost btn-sm" onclick="switchTab('notes')">הכל</button></div><div class="notes-grid">${(p.notes||[]).slice(0,2).map(n=>noteCard(n,p.id)).join('')}</div></div>`:''}
  `;
}

function tabTasks(p,body){
  const tasks=p.tasks||[];
  const open=tasks.filter(t=>!t.done);const closed=tasks.filter(t=>t.done);
  body.innerHTML=`
  <div class="add-row"><input class="input" id="qt-inp" placeholder="משימה חדשה מהירה..." onkeydown="if(event.key==='Enter')quickTask('${p.id}')"><button class="btn btn-primary btn-sm" onclick="openM('mod-task')">+</button></div>
  ${open.length>0?`<div class="task-list">${open.map(t=>taskRow(t,p.id)).join('')}</div>`:'<div style="color:var(--muted);font-size:.85rem;text-align:center;padding:20px">🎉 כל המשימות הושלמו!</div>'}
  ${closed.length>0?`<div class="section-head" style="margin-top:16px">הושלמו (${closed.length})</div><div class="task-list" style="opacity:.5">${closed.map(t=>taskRow(t,p.id)).join('')}</div>`:''}
  `;
}
function taskRow(t,pid){
  return`<div class="task-row">
    <div class="task-check${t.done?' done':''}" onclick="toggleTask('${pid}','${t.id}')">${t.done?'✓':''}</div>
    <div class="task-text${t.done?' done':''}" style="flex:1">${esc(t.text)}</div>
    ${t.due?`<span style="font-size:.68rem;color:var(--muted)">${new Date(t.due).toLocaleDateString('he-IL')}</span>`:''}
    <span class="pri-pill pri-${t.priority||'med'}">${priLbl(t.priority||'med')}</span>
    <button onclick="deleteTask('${pid}','${t.id}')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem;padding:2px 6px">✕</button>
  </div>`;
}

function tabNotes(p,body){
  body.innerHTML=`
  <button class="btn btn-primary btn-sm" style="margin-bottom:14px" onclick="openM('mod-note')">+ הערה חדשה</button>
  ${(p.notes||[]).length>0?`<div class="notes-grid">${(p.notes||[]).map(n=>noteCard(n,p.id)).join('')}</div>`:'<div class="empty"><div class="empty-icon">📝</div><div class="empty-text">אין הערות עדיין</div></div>'}
  `;
}
function noteCard(n,pid){
  return`<div class="note-card">
    <button class="note-del" onclick="deleteNote('${pid}','${n.id}')">✕</button>
    <div class="note-title">${esc(n.title||'הערה')}</div>
    <div class="note-body">${esc(n.body)}</div>
    <div class="note-date">${new Date(n.createdAt).toLocaleDateString('he-IL')}</div>
  </div>`;
}

function tabContacts(p,body){
  body.innerHTML=`
  <button class="btn btn-primary btn-sm" style="margin-bottom:14px" onclick="openM('mod-contact')">+ איש קשר</button>
  ${(p.contacts||[]).length>0?`<div class="contacts-list">${(p.contacts||[]).map(ct=>contactRow(ct,p.id)).join('')}</div>`:'<div class="empty"><div class="empty-icon">👥</div><div class="empty-text">אין אנשי קשר עדיין</div></div>'}
  `;
}
function contactRow(ct,pid){
  return`<div class="contact-row">
    <div class="c-avatar">${esc((ct.name||'?')[0])}</div>
    <div class="c-info">
      <div class="c-name">${esc(ct.name)}</div>
      <div class="c-detail">${esc([ct.role,ct.phone,ct.email].filter(Boolean).join(' · '))}</div>
    </div>
    <div class="c-actions">
      ${ct.phone?`<a href="tel:${esc(ct.phone)}" class="btn btn-ghost btn-sm">📞</a>`:''}
      <button onclick="confirmDelete(${esc(JSON.stringify('למחוק את '+ct.name+'?'))},()=>deleteContact('${pid}','${ct.id}'))" class="btn btn-ghost btn-sm">✕</button>
    </div>
  </div>`;
}

function tabCampaigns(p,body){
  const platKeys=Object.keys(PLATS);
  const camps=S.posts.filter(x=>x.projectId===p.id);
  body.innerHTML=`
  <div class="qpub">
    <div class="qpub-title">פרסום עבור ${esc(p.name)}</div>
    <div class="form-group"><input class="input" id="qp-title-${p.id}" placeholder="כותרת (אופציונלי)..."></div>
    <div class="form-group"><textarea class="input" id="qp-text-${p.id}" placeholder="תוכן הפוסט..." style="min-height:80px"></textarea></div>
    <div class="qpub-chips">
      ${platKeys.map(k=>`<div class="qpub-chip" role="button" tabindex="0" data-plat="${k}" onclick="this.classList.toggle('selected')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.classList.toggle('selected')}">${PLATS[k].icon} ${PLATS[k].name}</div>`).join('')}
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" onclick="quickPublish('${p.id}')">פרסם</button>
      <input type="datetime-local" class="input btn-sm" id="qp-sched-${p.id}" style="max-width:220px;padding:5px 10px" title="תזמון (אופציונלי)">
      <button class="btn btn-ghost btn-sm" onclick="nav('social')">הגדרות מדיה</button>
    </div>
  </div>
  ${camps.length>0?`<div class="card"><div class="card-header"><div class="card-title">היסטוריה (${camps.length})</div></div><table class="posts-table"><thead><tr><th>כותרת</th><th>פלטפורמות</th><th>סטטוס</th></tr></thead><tbody>${camps.slice().reverse().map(postRow).join('')}</tbody></table></div>`:''}
  `;
}
function quickPublish(pid){
  const title=document.getElementById('qp-title-'+pid)?.value?.trim()||'';
  const text=document.getElementById('qp-text-'+pid)?.value?.trim()||'';
  if(!text){toast('נא להזין תוכן','error');return;}
  const platforms=[...document.querySelectorAll('.qpub-chip.selected')].map(el=>el.dataset.plat);
  if(!platforms.length){toast('בחרו פלטפורמה אחת לפחות','error');return;}
  const schedVal=document.getElementById('qp-sched-'+pid)?.value;
  const isLater=schedVal&&new Date(schedVal)>new Date();
  submitPost({id:uid(),title,text,platforms,status:isLater?'scheduled':'sending',scheduledAt:isLater?new Date(schedVal).getTime():null,projectId:pid,createdAt:Date.now()});
}

  const c=document.getElementById('content');
  const platKeys=Object.keys(PLATS);
  const tgOn=!!(S.conns.telegram&&S.conns.telegram.on&&S.conns.telegram.token&&S.conns.telegram.chat);
  c.innerHTML=`
  <div class="section-head">פלטפורמות</div>
  <div class="platforms-grid">
    ${platKeys.map(k=>{const pl=PLATS[k];const auto=k==='telegram'&&tgOn;return`

      <div class="plat-icon">${pl.icon}</div>
      <div class="plat-name">${pl.name}</div>

      ${k==='telegram'?`<button class="plat-btn ${auto?'disconnect':'connect'}" onclick="openPlatModal('${k}')">${auto?'ערוך / נתק':'הגדרת שליחה אוטומטית'}</button>`:''}
    </div>`;}).join('')}
  </div>
  <p class="plat-note">Telegram נשלח ישירות מהדפדפן. בשאר הרשתות נפתח חלון שיתוף והטקסט מועתק אליכם, כי הן לא מאפשרות פרסום ישיר מדף אינטרנט.</p>
  <div class="pub-box">
    <div class="pub-title">פרסום תוכן</div>
    <div class="form-group"><label class="form-label" for="post-title">כותרת</label><input class="input" id="post-title" placeholder="כותרת הפוסט..."></div>
    <div class="form-group"><label class="form-label" for="post-text">טקסט</label><textarea class="input" id="post-text" placeholder="תוכן הפוסט..." style="min-height:90px"></textarea></div>
    <div class="form-group"><label class="form-label" for="post-proj">אפליקציה (אופציונלי, הקישור שלה יצורף)</label>
      <select class="input" id="post-proj"><option value="">—</option>${S.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
    </div>
    <div class="form-group"><label class="form-label">פלטפורמות</label>
      <div class="plat-chips">${platKeys.map(k=>`<div class="plat-chip" role="button" tabindex="0" data-plat="${k}" onclick="toggleChip(this,'${k}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleChip(this,'${k}')}">${PLATS[k].icon} ${PLATS[k].name}</div>`).join('')}</div>
    </div>
    <div class="sched-row">
      <label><input type="checkbox" id="sched-cb" onchange="document.getElementById('sched-dt').style.display=this.checked?'':'none'"> תזמון לתאריך</label>
      <input class="input" id="sched-dt" type="datetime-local" style="display:none;max-width:230px">
    </div>
    <button class="btn btn-primary" onclick="publishPost()">פרסם</button>
  </div>
  ${S.posts.length>0?`<div class="card" style="margin-top:20px"><div class="card-header"><div class="card-title">היסטוריית פוסטים</div></div>${postsTableHTML('all',20)}</div>`:''}
  `;
}

function toggleChip(el,k){el.classList.toggle('selected');}
function openPlatModal(k){
  const pl=PLATS[k];if(!pl.fields)return;const conn=S.conns[k]||{};
  document.getElementById('plat-modal-title').innerHTML=`${pl.icon} ${esc(pl.name)}`;
  document.getElementById('plat-modal-body').innerHTML=`
    ${pl.fields.map(f=>`<div class="form-group"><label class="form-label" for="plat-f-${f.id}">${f.label}</label><input class="input" id="plat-f-${f.id}" type="${f.type}" placeholder="${f.ph}" value="${esc(conn[f.id]||'')}" dir="ltr" autocomplete="off"></div>`).join('')}
    <p class="plat-note">המפתח נשמר רק בדפדפן הזה ונשלח רק אל Telegram. הוסיפו את הבוט כמנהל בערוץ או בקבוצה.</p>
    <div class="modal-foot">
      ${conn.on?`<button class="btn btn-danger" onclick="disconnectPlat('${k}')">נתק</button>`:''}
      <button class="btn btn-ghost" onclick="closeM('mod-platform')">ביטול</button>
      <button class="btn btn-primary" onclick="connectPlat('${k}')">שמור</button>
    </div>
  `;
  openM('mod-platform');
}
function connectPlat(k){
  const pl=PLATS[k];const data={on:true};
  pl.fields.forEach(f=>{data[f.id]=document.getElementById('plat-f-'+f.id).value.trim();});
  if(k==='telegram'&&!/^\d+:[\w-]+$/.test(data.token||'')){toast('ה-Bot Token לא תקין','error');return;}
  if(k==='telegram'&&!data.chat){toast('חסר Chat ID או שם ערוץ','error');return;}
  S.conns[k]=data;save();closeM('mod-platform');renderSocial();toast('✓ '+pl.name+' הוגדר','success');
}

// ── publishing engine ──
function postText(post){
  const p=S.projects.find(x=>x.id===post.projectId);
  const u=p&&/^https?:/i.test(p.url||'')?p.url:'';
  return[post.title,post.text,u].filter(Boolean).join('\n\n');
}
function shareUrl(k,post){
  const p=S.projects.find(x=>x.id===post.projectId);
  const link=p&&/^https?:/i.test(p.url||'')?p.url:location.origin;
  const t=encodeURIComponent(postText(post));
  return({
    facebook:'https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(link),
    whatsapp:'https://wa.me/?text='+t,
    telegram:'https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+t,
    instagram:'https://www.instagram.com/',
    tiktok:'https://www.tiktok.com/upload',
    youtube:'https://studio.youtube.com/'
  })[k];
}
async function sendTelegram(post){
  const c=S.conns.telegram||{};
  if(!c.on||!c.token||!c.chat)return'ready';
  try{
    const r=await fetch('https://api.telegram.org/bot'+c.token+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:c.chat,text:postText(post)})});
    const j=await r.json();
    if(j.ok)return'sent';
    post.errors.telegram=j.description||'שגיאה לא ידועה';return'failed';
  }catch(e){post.errors.telegram='אין חיבור ל-Telegram מהדפדפן הזה';return'failed';}
}
async function dispatchPost(post){
  post.results={};post.errors={};
  for(const k of post.platforms){post.results[k]=k==='telegram'?await sendTelegram(post):'ready';}
  const v=Object.values(post.results);
  post.status=v.includes('failed')?'failed':v.includes('ready')?'ready':'sent';
  save();
}
async function submitPost(post){
  S.posts.push(post);save();
  if(post.status==='scheduled'){toast('הפוסט תוזמן. הוא יישלח כשה-CRM פתוח בזמן היעד','success');refreshPosts();return;}
  toast('שולח...');
  await dispatchPost(post);
  refreshPosts();
  if(post.status==='ready')openShare(post.id);
  else if(post.status==='sent')toast('הפוסט נשלח','success');
  else toast('השליחה נכשלה: '+Object.values(post.errors).join(', '),'error');
}
function refreshPosts(){
  if(S.view==='social')renderSocial();
  else if(S.view==='detail')renderTab('campaigns');
  else if(S.view==='dashboard')renderDash();
}
function publishPost(){
  const title=document.getElementById('post-title')?.value?.trim()||'';
  const text=document.getElementById('post-text')?.value?.trim()||'';
  if(!text){toast('נא להזין תוכן','error');return;}
  const platforms=[...document.querySelectorAll('.plat-chip.selected')].map(el=>el.dataset.plat);
  if(!platforms.length){toast('בחרו פלטפורמה אחת לפחות','error');return;}
  const sched=document.getElementById('sched-cb')?.checked?document.getElementById('sched-dt')?.value:null;
  const isLater=sched&&new Date(sched)>new Date();
  const projectId=document.getElementById('post-proj')?.value||null;
  submitPost({id:uid(),title,text,platforms,status:isLater?'scheduled':'sending',scheduledAt:isLater?new Date(sched).getTime():null,projectId,createdAt:Date.now()});
}
function openShare(id){
  const post=S.posts.find(x=>x.id===id);if(!post)return;
  const rows=post.platforms.filter(k=>(post.results||{})[k]==='ready').map(k=>`<div class="share-row"><div class="share-name">${PLATS[k].icon} ${esc(PLATS[k].name)}</div><div class="share-act"><button class="btn btn-ghost btn-sm" onclick="copyPostText('${post.id}')">העתק טקסט</button><a class="btn btn-primary btn-sm" href="${esc(shareUrl(k,post))}" target="_blank" rel="noopener" onclick="copyPostText('${post.id}',true)">פתח ושתף</a></div></div>`).join('');
  document.getElementById('share-body').innerHTML=`<p class="plat-note" style="margin-top:0">הטקסט מועתק אוטומטית כשפותחים. הדביקו אותו ברשת שנפתחת.</p>${rows||'<div class="empty-text">אין פלטפורמות שממתינות לשיתוף</div>'}<div class="modal-foot"><button class="btn btn-ghost" onclick="closeM('mod-share')">סגור</button></div>`;
  openM('mod-share');
}
async function copyPostText(id,quiet){
  const post=S.posts.find(x=>x.id===id);if(!post)return;
  try{await navigator.clipboard.writeText(postText(post));if(!quiet)toast('הטקסט הועתק','success');}
  catch(e){if(!quiet)toast('ההעתקה נחסמה. סמנו והעתיקו ידנית','error');}
}
let _ticking=false;
async function tickScheduled(){
  if(_ticking)return;_ticking=true;
  try{
    const due=S.posts.filter(x=>x.status==='scheduled'&&x.scheduledAt&&x.scheduledAt<=Date.now());
    for(const post of due){
      post.status='sending';await dispatchPost(post);
      toast(post.status==='ready'?'פוסט מתוזמן מוכן לשיתוף בהיסטוריה':post.status==='sent'?'פוסט מתוזמן נשלח':'פוסט מתוזמן נכשל',post.status==='failed'?'error':'success');
    }
    if(due.length)refreshPosts();
  }finally{_ticking=false;}
}
function statusLbl(s){return{sent:'נשלח',scheduled:'מתוזמן',sending:'שולח',ready:'מוכן לשיתוף',draft:'טיוטה',failed:'נכשל'}[s]||s;}
function statusCls(s){return{sent:'pp-sent',scheduled:'pp-sched',sending:'pp-sched',ready:'pp-sched',draft:'pp-draft',failed:'pp-fail'}[s]||'pp-draft';}
function postsTableHTML(filter,limit){
  let list=filter==='all'?S.posts:S.posts.filter(x=>x.projectId===filter);
  list=list.slice(-limit).reverse();
  if(!list.length)return'<div style="color:var(--muted);padding:14px;font-size:.85rem">אין פוסטים</div>';
  return`<table class="posts-table"><thead><tr><th>כותרת</th><th>פלטפורמות</th><th>סטטוס</th></tr></thead><tbody>${list.map(postRow).join('')}</tbody></table>`;
}
function postRow(p){
  const pill=p.status==='ready'?`<button class="post-pill pp-sched" style="border:none;cursor:pointer" onclick="openShare('${p.id}')">מוכן לשיתוף ›</button>`
    :`<span class="post-pill ${statusCls(p.status)}"${p.status==='failed'&&p.errors?` title="${esc(Object.values(p.errors).join(', '))}"`:''}>${statusLbl(p.status)}</span>`;
  return`<tr><td>${esc(p.title||(p.text||'').slice(0,30)||'—')}</td><td><div class="post-plats">${(p.platforms||[]).map(k=>PLATS[k]?PLATS[k].icon:'').join('')}</div></td><td>${pill}</td></tr>`;
}

  document.getElementById('browser-url-lbl').textContent=hostLabel(p.url);

  clearTimeout(_hintTimer);hint.classList.remove('show');
  player.classList.remove('hidden');
  document.body.style.overflow='hidden';
  S.recent=[pid].concat((S.recent||[]).filter(x=>x!==pid)).slice(0,6);S.featured=pid;save();
  if(p.url){
    const abs=new URL(p.url,location.href).href;
    ext.href=abs;ext.hidden=false;document.getElementById('pl-hint-link').href=abs;
    noUrl.classList.add('hidden');loading.classList.remove('done');
    frame.style.visibility='';
    frame.onload=()=>{clearTimeout(_hintTimer);loading.classList.add('done');};
    frame.src=abs;
    if(/^https?:/i.test(p.url))_hintTimer=setTimeout(()=>hint.classList.add('show'),4500);
  }else{
    ext.hidden=true;frame.src='about:blank';frame.style.visibility='hidden';
    loading.classList.add('done');
    document.getElementById('no-url-msg').textContent='הוסיפו את הדומיין של '+p.name+' והוא ייפתח כאן';
    noUrl.classList.remove('hidden');
    const inp=document.getElementById('browser-url-inp');inp.value='';
  }
}
function closeBrowser(){
  clearTimeout(_hintTimer);
  document.getElementById('app-browser').classList.add('hidden');
  const f=document.getElementById('browser-frame');f.onload=null;f.src='about:blank';
  document.body.style.overflow='';
  if(S.view==='home')renderHome();
}
function saveBrowserUrl(){
  let url=document.getElementById('browser-url-inp').value.trim();
  if(!url){toast('הכנס URL תקין','error');return;}
  if(!/^https?:\/\//i.test(url)&&/\./.test(url))url='https://'+url;
  const p=S.projects.find(x=>x.id===_browserPid);
  if(p){p.url=url;save();toast('✓ הכתובת נשמרה','success');}
  openBrowser(_browserPid);
}
function deleteProject(id){
  S.projects=S.projects.filter(x=>x.id!==id);S.recent=(S.recent||[]).filter(x=>x!==id);if(S.featured===id)S.featured=null;save();nav('home');toast('פרוייקט נמחק');
}

function saveTask(){

  const p=S.projects.find(x=>x.id===S.pid);if(!p)return;
  p.tasks.push({id:uid(),text,done:false,priority:document.getElementById('tf-pri').value,due:document.getElementById('tf-due').value,notes:document.getElementById('tf-notes').value,createdAt:Date.now()});
  save();closeM('mod-task');renderTab('tasks');toast('✓ משימה נוספה','success');
}
function quickTask(pid){

function toggleTask(pid,tid){

function saveNote(){

function saveContact(){

// ═══════════════════════════════════════════════════════════════
// MODALS / UTILS
// ═══════════════════════════════════════════════════════════════
function openM(id){document.getElementById(id).classList.remove('hidden');}
function closeM(id){document.getElementById(id).classList.add('hidden');}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('bn-item')){e.preventDefault();e.target.click();}if(e.key==='Escape'){const o=document.querySelectorAll('.overlay:not(.hidden)');if(o.length)o.forEach(el=>el.classList.add('hidden'));else if(!document.getElementById('app-browser').classList.contains('hidden'))closeBrowser();}});
document.querySelectorAll('.overlay').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.add('hidden');}));

function confirmDelete(msg,cb){
  document.getElementById('confirm-msg').textContent=msg;
  const ok=document.getElementById('confirm-ok');
  ok.onclick=()=>{closeM('mod-confirm');cb();};
  openM('mod-confirm');
}

function toast(msg,type='info'){
  const t=document.createElement('div');
  t.className='toast'+(type==='success'?' success':type==='error'?' error':'');
  t.innerHTML=`<span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(),3200);
}

function toggleTheme(){
  const cur=document.documentElement.dataset.theme||'dark';
  document.documentElement.dataset.theme=cur==='dark'?'light':'dark';
}

function globalSearch(q){
  if(!q){render();return;}
  const lo=q.toLowerCase();
  const res=S.projects.filter(p=>p.name.toLowerCase().includes(lo)||p.description?.toLowerCase().includes(lo));
  const c=document.getElementById('content');
  if(S.view!=='projects'){S.view='projects';syncNav();syncTopbar();}
  c.innerHTML=`<div class="projects-grid">${res.length?res.map(projCard).join(''):'<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--muted)">לא נמצאו פרוייקטים</div>'}</div>`;
}
