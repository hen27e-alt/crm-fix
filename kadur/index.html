<!doctype html><html dir="rtl" lang="he">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>כדור בדולח</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700&family=Space+Grotesk:wght@700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;font-family:'Heebo',sans-serif;background:#020115;color:#ddd6fe;overflow-x:hidden}
.stars{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.9}}
.bg-glow{position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 60%,rgba(109,40,217,.3) 0%,transparent 60%),radial-gradient(ellipse 40% 40% at 20% 20%,rgba(49,46,129,.4) 0%,transparent 50%);pointer-events:none}
.app{max-width:430px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column;gap:20px;position:relative;z-index:1}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 0}
.back-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#ddd6fe;border-radius:12px;padding:8px 14px;font-family:'Heebo',sans-serif;font-size:.85rem;cursor:pointer}
.tb-spacer{flex:1}
.badge{font-size:.7rem;background:linear-gradient(135deg,#4c1d95,#6d28d9);color:#c4b5fd;border:1px solid rgba(109,40,217,.4);border-radius:20px;padding:4px 10px}
.crystal-container{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.crystal{font-size:5rem;line-height:1;text-align:center;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(167,139,250,.6))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.crystal-title{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,#c4b5fd,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center}
.crystal-sub{font-size:.8rem;color:rgba(221,214,254,.45);text-align:center;line-height:1.5}
.ask-section{display:flex;flex-direction:column;gap:10px}
.ask-label{font-size:.8rem;color:rgba(221,214,254,.5);font-weight:600}
.ask-input{background:rgba(109,40,217,.12);border:1px solid rgba(109,40,217,.3);border-radius:16px;padding:14px 16px;color:#ddd6fe;font-family:'Heebo',sans-serif;font-size:.95rem;width:100%;resize:none;outline:none;transition:border-color .2s}
.ask-input::placeholder{color:rgba(221,214,254,.3)}
.ask-input:focus{border-color:rgba(109,40,217,.6)}
.ask-btn{background:linear-gradient(135deg,#4c1d95,#6d28d9);border:none;border-radius:16px;padding:16px;color:#e9d5ff;font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .15s,transform .15s;letter-spacing:.03em}
.ask-btn:hover{opacity:.9;transform:scale(.98)}
.ask-btn:disabled{opacity:.5}
.answer-card{background:linear-gradient(135deg,rgba(76,29,149,.25),rgba(109,40,217,.15));border:1px solid rgba(109,40,217,.3);border-radius:20px;padding:20px;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.answer-label{font-size:.7rem;color:rgba(221,214,254,.4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.answer-text{font-size:1rem;color:#e9d5ff;line-height:1.6;font-weight:500}
.answer-stars{color:#fbbf24;font-size:.85rem;margin-top:10px;letter-spacing:.1em}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mood{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;transition:background .15s}
.mood:hover{background:rgba(109,40,217,.2)}
.mood-icon{font-size:1.4rem}
.mood-lbl{font-size:.6rem;color:rgba(221,214,254,.45);margin-top:4px}
.section-title{font-size:.75rem;font-weight:700;color:rgba(221,214,254,.35);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="stars" id="stars"></div>
<div class="app">
  <div class="topbar">
    <button class="back-btn" onclick="try{window.parent.closeBrowser()}catch(e){history.back()}">← CRM</button>
    <div class="tb-spacer"></div>
    <div class="badge">✨ AI מיסטי</div>
  </div>

  <div class="crystal-container">
    <div class="crystal">🔮</div>
    <div class="crystal-title">כדור בדולח</div>
    <div class="crystal-sub">שאל את הכדור שאלה<br>וקבל תשובה מהיקום</div>
  </div>

  <div>
    <div class="section-title">מצב רוח לפני השאלה</div>
    <div class="moods">
      <div class="mood"><div class="mood-icon">😌</div><div class="mood-lbl">רגוע</div></div>
      <div class="mood"><div class="mood-icon">🤔</div><div class="mood-lbl">מתלבט</div></div>
      <div class="mood"><div class="mood-icon">😰</div><div class="mood-lbl">מודאג</div></div>
      <div class="mood"><div class="mood-icon">✨</div><div class="mood-lbl">פתוח</div></div>
    </div>
  </div>

  <div class="ask-section">
    <div class="ask-label">🌙 שאלתך לכדור</div>
    <textarea class="ask-input" id="q-input" rows="3" placeholder="כתוב את שאלתך כאן..."></textarea>
    <button class="ask-btn" id="ask-btn" onclick="askBall()">🔮 שאל את הכדור</button>
  </div>

  <div id="answer-area"></div>
</div>
<script>
const stars=document.getElementById('stars');
for(let i=0;i<80;i++){
  const s=document.createElement('div');
  s.className='star';
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${1.5+Math.random()*3}s;width:${1+Math.random()*2}px;height:${1+Math.random()*2}px;animation-delay:${Math.random()*3}s`;
  stars.appendChild(s);
}
const answers=[
  'הכוחות של היקום מכוונים אותך לכיוון הנכון. סמוך על תחושת הבטן שלך.',
  'לפעמים ההמתנה היא עצמה התשובה. תן לזמן לעשות את שלו.',
  'שינוי גדול מתקרב — פתח את ליבך לאפשרויות חדשות.',
  'התשובה שאתה מחפש כבר בתוכך. עצור, נשום, הקשב.',
  'הדרך קדימה ברורה יותר ממה שנראה כרגע. צעד אחד בכל פעם.',
  'כוחות חיוביים סובבים אותך עכשיו. הרגע הזה הוא הזמן לפעול.',
  'לפעמים מה שנדמה כמכשול הוא בעצם כיוון חדש ומבטיח.',
  'היקום שומע אותך. המשך לשלוח את כוונותיך לחלל.',
];
function askBall(){
  const q=document.getElementById('q-input').value.trim();
  if(!q)return;
  const btn=document.getElementById('ask-btn');
  btn.disabled=true;btn.textContent='הכדור חושב...';
  setTimeout(()=>{
    const a=answers[Math.floor(Math.random()*answers.length)];
    document.getElementById('answer-area').innerHTML=`<div class="answer-card"><div class="answer-label">✦ תשובת הכדור</div><div class="answer-text">${a}</div><div class="answer-stars">★ ★ ★ ★ ★</div></div>`;
    btn.disabled=false;btn.textContent='🔮 שאל שוב';
  },1800);
}
</script>
</body>
</html>
